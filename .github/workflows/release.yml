name: release

# Triggers only on semver tags (v1.0.0, v1.2.3-rc.1, etc.).
# Never runs on pull requests.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: pack & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
            nuget-

      - name: Validate tag and extract version
        id: version
        run: |
          # Tag must be vX.Y.Z (optionally with a -prerelease suffix).
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid vX.Y.Z[-suffix] tag."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Bump <Version> / <PackageVersion>
        # Keep src/Blazor.Toolkit.Templates.csproj in sync with the tag so a
        # manual `dotnet pack` against a fresh checkout produces the
        # same nupkg as the one published by this workflow.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i.bak -E \
            "s|<Version>[^<]+</Version>|<Version>${VERSION}</Version>|; \
             s|<PackageVersion>[^<]+</PackageVersion>|<PackageVersion>${VERSION}</PackageVersion>|" \
            src/Blazor.Toolkit.Templates.csproj
          rm -f src/Blazor.Toolkit.Templates.csproj.bak

      - name: Pack
        run: dotnet pack src/Blazor.Toolkit.Templates.csproj -c Release --output artifacts/packages --no-restore

      - name: Sign NuGet package
        # Opt-in: when the secrets are not configured, this
        # entire step is skipped and the publish step below
        # receives the unsigned .nupkg as it does today.
        if: ${{ secrets.NUGET_SIGNING_CERT_BASE64 != '' && secrets.NUGET_SIGNING_CERT_PASSWORD != '' }}
        env:
          CERT_BASE64: ${{ secrets.NUGET_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_BASE64" | base64 -d > signing-cert.pfx

          for pkg in artifacts/packages/*.nupkg; do
            [ -f "$pkg" ] || continue
            echo "Signing $pkg ..."
            dotnet nuget sign "$pkg" \
              --certificate-path signing-cert.pfx \
              --certificate-password "$CERT_PASSWORD" \
              --timestamper http://timestamp.digicert.com \
              --overwrite
          done

          # Destroy the certificate immediately
          shred -u signing-cert.pfx 2>/dev/null || rm -f signing-cert.pfx

      - name: Verify package signature
        if: ${{ secrets.NUGET_SIGNING_CERT_BASE64 != '' && secrets.NUGET_SIGNING_CERT_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for pkg in artifacts/packages/*.nupkg; do
            [ -f "$pkg" ] || continue
            echo "Verifying signature of $pkg ..."
            dotnet nuget verify "$pkg" --all
          done
          echo "All packages are correctly signed."

      - name: Note signing status
        if: ${{ secrets.NUGET_SIGNING_CERT_BASE64 == '' || secrets.NUGET_SIGNING_CERT_PASSWORD == '' }}
        run: |
          echo "::notice::NUGET_SIGNING_CERT_BASE64 or NUGET_SIGNING_CERT_PASSWORD is not configured. Publishing unsigned package."

      - name: Upload .nupkg as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: templates-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Packages
        # Publishes to this repository's Packages tab
        # (https://github.com/syncfusion/blazor-toolkit-templates/packages)
        # so the published package is hosted alongside the repo that owns it.
        # Authentication uses the workflow's built-in GITHUB_TOKEN; the
        # `packages: write` permission on this job is sufficient.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: dotnet nuget push "artifacts/packages/*.nupkg" \
              --source "$NUGET_SOURCE" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate